title: Cloud Metadata / Kubernetes Token Credential Harvesting (UAT-10608)
id: 8f7b421c-e1c6-468f-93b1-0424d9ab9b02
status: experimental
description: |
    Detects the post-exploitation credential-harvesting stages run by UAT-10608 against
    web-application hosts: querying the cloud Instance Metadata Service (IMDS, 169.254.169.254)
    for IAM role credentials, and reading the Kubernetes default service-account token. On a
    web app server, a shell reaching IMDS or catting the serviceaccount token is a strong
    foothold-to-lateral-movement signal — the natural follow-on once secrets like config.py's
    DB_CONNECTION_STRING / AWS keys give an attacker code execution.
references:
    - https://api.threatstream.com/api/v1/tipreport/32321014/  # UAT-10608
    - https://attack.mitre.org/techniques/T1552/001/
    - https://attack.mitre.org/techniques/T1552/005/
author: fixpoint-demo threat-intel
date: 2026-07-27
tags:
    - attack.credential-access
    - attack.t1552.001
    - attack.t1552.005
    - attack.discovery
    - attack.t1580
logsource:
    category: process_creation
detection:
    selection_imds:
        CommandLine|contains:
            - '169.254.169.254'
            - 'metadata.google.internal'
            - 'metadata/instance'                       # Azure IMDS path
            - 'latest/meta-data/iam/security-credentials'
    selection_k8s_token:
        CommandLine|contains: '/var/run/secrets/kubernetes.io/serviceaccount/token'
    selection_tooling:
        Image|endswith:
            - '/curl'
            - '/wget'
            - '/cat'
            - '/python3'
    condition: (selection_imds or selection_k8s_token) and selection_tooling
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Legitimate cloud SDKs/agents querying IMDS (baseline the expected parent processes)
    - In-cluster apps that read their own service-account token at startup (scope to web/edge hosts)
level: high
